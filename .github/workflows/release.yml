name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Stage and build deb
        run: |
          PKG=service-toggle_${{ env.VERSION }}
          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/usr/local/bin
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/scalable/apps

          cp service_toggle/__main__.py $PKG/usr/local/bin/service-toggle
          chmod 755 $PKG/usr/local/bin/service-toggle

          cp data/service-toggle.desktop         $PKG/usr/share/applications/
          cp data/icons/service-toggle.svg       $PKG/usr/share/icons/hicolor/scalable/apps/
          cp packaging/deb/service-toggle_1.0.0/DEBIAN/control  $PKG/DEBIAN/control
          cp packaging/deb/service-toggle_1.0.0/DEBIAN/postinst $PKG/DEBIAN/postinst
          chmod 755 $PKG/DEBIAN/postinst

          sed -i "s/^Version:.*/Version: ${{ env.VERSION }}/" $PKG/DEBIAN/control

          dpkg-deb --root-owner-group --build $PKG
          mv ${PKG}.deb service-toggle_${{ env.VERSION }}_all.deb

      - uses: actions/upload-artifact@v4
        with:
          name: service-toggle-deb
          path: "*.deb"

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install --force-clean \
            build-dir \
            packaging/flatpak/io.github.oguzemrebal.ServiceToggle.yaml
          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            service-toggle.flatpak \
            io.github.oguzemrebal.ServiceToggle

      - uses: actions/upload-artifact@v4
        with:
          name: service-toggle-flatpak
          path: "*.flatpak"

  release:
    name: Create GitHub Release
    needs: [build-deb, build-flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.flatpak
          generate_release_notes: true
          body: |
            ## Install

            ### Ubuntu / Debian (.deb)
            ```bash
            sudo dpkg -i service-toggle_*.deb
            sudo apt-get install -f
            ```

            ### Flatpak (any Linux distro)
            ```bash
            flatpak install service-toggle.flatpak
            ```

            ### Manual
            ```bash
            git clone https://github.com/oguzemrebal/service-toggle
            cd service-toggle
            sudo cp service_toggle/__main__.py /usr/local/bin/service-toggle
            sudo chmod +x /usr/local/bin/service-toggle
            sudo cp data/service-toggle.desktop /usr/share/applications/
            sudo cp data/icons/service-toggle.svg /usr/share/icons/hicolor/scalable/apps/
            ```
