[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "service-toggle"
version = "1.0.0"
description = "GTK4 panel to toggle background services and CPU cores on Ubuntu"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"

[project.scripts]
service-toggle = "service_toggle.__main__:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/service-toggle"
Issues   = "https://github.com/YOUR_USERNAME/service-toggle/issues"
